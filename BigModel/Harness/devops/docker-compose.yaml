services:
  deepseek-harness:
    image: austsxk/deepseek-harness-dev-base:${VERSION}
    container_name: deepseek-harness
    user: "0:0"
    restart: always
    privileged: true
    working_dir: /workspace
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      HOME: /workspace
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DSH_PERMISSION_MODE: danger-full-access

    volumes:
      # Harness 配置、模型配置、Session、插件等
      - dsh-home:/workspace/.dsh
      # 宿主机工作目录
      - ${MOUNT_WORKSPACE}:/workspace:rw
      # 宿主机docker
      - ${DOCKER_RUNTIME_PATH}:/var/run/docker.sock

    # Harness 只能被 Docker 网络中的 nginx 访问
    expose:
      - "3080"
    # 配置shell的空间
    shm_size: "2gb"
    stdin_open: true
    tty: true
    # read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    networks:
      - harness-net


  nginx:
    image: nginx:1.29-alpine
    container_name: deepseek-harness-nginx
    restart: always

    depends_on:
      - deepseek-harness
    ports:
      # http://服务器IP:3080
      - "${ACCESS_PORT}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/htpasswd:/etc/nginx/.htpasswd:ro

    networks:
      - harness-net

networks:
  harness-net:
    driver: bridge


volumes:
  dsh-home: